version: '3.8'

services:
  # ==========================================
  # PostgreSQL 16 with PostGIS & pgcrypto
  # ==========================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: krishilink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krishi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krishi_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-krishilink}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - krishilink_pgdata:/var/lib/postgresql/data
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seeds/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi_admin -d krishilink"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 7 for Realtime Tracking & Pub/Sub
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: krishilink_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - krishilink_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  krishilink_pgdata:
    driver: local
  krishilink_redisdata:
    driver: local
